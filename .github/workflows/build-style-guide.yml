name: Build generated documentation

on:
  pull_request:
    paths:
      - "STYLE_GUIDE.parts/**"
      - "CONTRIBUTING.blocks/**"
      - "CHANGELOG.entries/**"
      - "scripts/build_style_guide.py"
      - "scripts/update_contributing.py"
      - "scripts/update_changelog.py"
      - "scripts/publish.py"
      - "STYLE_GUIDE.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "Makefile"
      - ".github/workflows/build-style-guide.yml"
  push:
    branches:
      - main
    paths:
      - "STYLE_GUIDE.parts/**"
      - "CONTRIBUTING.blocks/**"
      - "CHANGELOG.entries/**"
      - "scripts/build_style_guide.py"
      - "scripts/update_contributing.py"
      - "scripts/update_changelog.py"
      - "scripts/publish.py"
      - "STYLE_GUIDE.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "Makefile"
      - ".github/workflows/build-style-guide.yml"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-generated-documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble generated documentation
        run: |
          python scripts/build_style_guide.py
          python scripts/update_contributing.py
          python scripts/update_changelog.py

      - name: Validate repository tooling
        run: python scripts/publish.py validate

      - name: Check generated diff
        run: git diff --check

      - name: Require committed artifacts in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- STYLE_GUIDE.md CONTRIBUTING.md CHANGELOG.md

      - name: Commit rebuilt artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- STYLE_GUIDE.md CONTRIBUTING.md CHANGELOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STYLE_GUIDE.md CONTRIBUTING.md CHANGELOG.md
          git commit -m "Rebuild generated documentation"
          git push
