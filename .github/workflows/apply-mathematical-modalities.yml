name: Apply mathematical modalities patch

on:
  push:
    branches:
      - transport/mathematical-modalities

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed patch to main
        shell: bash
        run: |
          set -euo pipefail

          BASE=9775bd72c833021ee31547602fb474a1d0371c7c
          PATCH_SHA=011a166d610df4216779e0ccef462fda2728cbd534fac23a056317b5141b7003

          cat .transport/modalities/chunk* | base64 -d > /tmp/modalities.patch
          echo "${PATCH_SHA}  /tmp/modalities.patch" | sha256sum -c -

          git checkout --detach "$BASE"
          git apply --index /tmp/modalities.patch

          export GIT_AUTHOR_NAME=dzackgarza
          export GIT_AUTHOR_EMAIL=1149853+dzackgarza@users.noreply.github.com
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          tree=$(git write-tree)
          commit=$(printf '%s\n' 'Teach standard mathematical thought modalities' | git commit-tree "$tree" -p "$BASE")

          git push origin "$commit:refs/heads/main"
          git push origin --delete transport/mathematical-modalities || true
