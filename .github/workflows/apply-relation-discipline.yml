name: Apply relation-discipline patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-relation-discipline.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed local patch
        shell: bash
        run: |
          cat .github/patches/relation-discipline/chunk-* | base64 -d > /tmp/relation-discipline.patch
          git apply --check /tmp/relation-discipline.patch
          git apply /tmp/relation-discipline.patch
          rm -rf .github/patches/relation-discipline
          rm .github/workflows/apply-relation-discipline.yml
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add -A
          git commit -m 'Require explicit isomorphisms and mathematical transport'
          git push origin HEAD:main
